# Experiment: can a GTK4 + libadwaita app be built for Android (TV) and run?
# Builds android-poc/ with pixiewood, then runs it on an emulator and takes
# screenshots. Not part of the normal app build.
name: Android TV probe
on:
  push:
    branches: [claude/project-thread-z007gb]
    paths: ['android-poc/**', '.github/workflows/android-poc.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: android-poc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sp1ritCS/gtk-android-builder
          path: pixiewood
      - uses: actions/checkout@v7
        with:
          repository: sp1ritCS/mini-studio
          path: mini
      - name: Host tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk libglib-perl libglib-object-introspection-perl libipc-run-perl libjson-perl libset-scalar-perl libxml-libxml-perl libxml-libxslt-perl build-essential glslc gobject-introspection gir1.2-appstream libglib2.0-dev-bin libxml2-utils sassc git gettext
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Meson and Ninja
        run: |
          python -m pip install meson ninja
          echo "$GITHUB_WORKSPACE/pixiewood" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME" "$ANDROID_HOME/ndk" || true
      - name: Prepare
        run: pixiewood -v prepare --android-studio-dir="$GITHUB_WORKSPACE/mini" --sdk="$ANDROID_HOME" pixiewood.xml
      - name: Generate
        run: pixiewood -v generate
      - name: Build
        run: pixiewood -v build
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 .pixiewood/bin-*/meson-logs/meson-log.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: hightide-tv-probe-apks
          path: android-poc/.pixiewood/android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-input
          path: |
            android-poc/.pixiewood/android/app/build/outputs/apk/debug/
          retention-days: 1

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: emulator-input
          path: android-poc/.pixiewood/android/app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh android-poc/emulator-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screenshots
          path: android-poc/out/

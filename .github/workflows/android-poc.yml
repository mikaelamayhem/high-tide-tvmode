# Experiment: can a GTK4 + libadwaita app be built for Android (TV) and run?
# Builds android-poc/ with pixiewood, then runs it on an emulator and takes
# screenshots. Not part of the normal app build.
name: Android TV probe
on:
  push:
    branches: [claude/project-thread-z007gb]
    paths: ['android-poc/**', '.github/workflows/android-poc.yml']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: android-poc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sp1ritCS/gtk-android-builder
          path: pixiewood
      - uses: actions/checkout@v7
        with:
          repository: sp1ritCS/mini-studio
          path: mini
      - name: Host tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk libglib-perl libglib-object-introspection-perl libipc-run-perl libjson-perl libset-scalar-perl libxml-libxml-perl libxml-libxslt-perl build-essential glslc gobject-introspection gir1.2-appstream libglib2.0-dev-bin libxml2-utils sassc git gettext
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Meson and Ninja
        run: |
          python -m pip install meson ninja
          echo "$GITHUB_WORKSPACE/pixiewood" >> "$GITHUB_PATH"
          ls "$ANDROID_HOME" "$ANDROID_HOME/ndk" || true
      - name: Fetch Python for Android and PyGObject
        env:
          PY_VERSION: 3.14.10
          PYGOBJECT_VERSION: 3.58.1
        run: |
          set -eux
          for cpu in x86_64 aarch64; do
            mkdir -p python/$cpu
            curl -fsSL "https://www.python.org/ftp/python/$PY_VERSION/python-$PY_VERSION-$cpu-linux-android.tar.gz" | tar -xz -C python/$cpu
          done
          ls python/x86_64 python/x86_64/prefix python/x86_64/prefix/lib | head -50
          git clone -q --depth 1 -b "$PYGOBJECT_VERSION" https://github.com/GNOME/pygobject pygobject
          rev=$(sed -n 's/^revision *= *//p' pygobject/subprojects/pythoncapi-compat.wrap)
          mkdir -p pythoncapi-compat
          curl -fsSL "https://raw.githubusercontent.com/python/pythoncapi-compat/$rev/pythoncapi_compat.h" -o pythoncapi-compat/pythoncapi_compat.h
      - name: Build typelibs from the host's GIR files
        run: |
          set -eux
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev gir1.2-glib-2.0-dev gir1.2-freedesktop-dev
          # Android libraries have no version suffix: libgtk-4.so.1 -> libgtk-4.so
          mkdir -p /tmp/gir
          for f in /usr/share/gir-1.0/*.gir; do
            sed -E 's/(lib[A-Za-z0-9_.+-]*\.so)(\.[0-9]+)+/\1/g' "$f" > /tmp/gir/$(basename "$f")
          done
          grep -ho 'shared-library="[^"]*"' /tmp/gir/*.gir | sort -u
          for f in /tmp/gir/*.gir; do
            n=$(basename "$f" .gir)
            g-ir-compiler --includedir=/tmp/gir "$f" -o "typelibs/$n.typelib" || echo "skipped $n"
          done
          ls typelibs
      - name: Add our GTK patches to pixiewood
        run: cp patches/*.patch "$GITHUB_WORKSPACE/pixiewood/prepare/wraps/gtk/"
      - name: Prepare
        run: pixiewood -v prepare --android-studio-dir="$GITHUB_WORKSPACE/mini" --sdk="$ANDROID_HOME" pixiewood.xml
      - name: Generate
        run: pixiewood -v generate
      - name: Build
        run: pixiewood -v build
      - name: Show what went into the APK
        run: |
          find .pixiewood/root/lib -name '*.so' | sort | head -100
          find .pixiewood/root -name '_gi*.so' -exec sh -c 'llvm-readelf -d "$1" 2>/dev/null || readelf -d "$1"' _ {} \; | grep NEEDED || true
          du -sh .pixiewood/android/app/build/outputs/apk/debug/* || true
      - name: Logs on failure
        if: failure()
        run: |
          tail -n 200 .pixiewood/bin-*/meson-logs/meson-log.txt || true
      - uses: actions/upload-artifact@v7
        with:
          name: hightide-tv-probe-apks
          path: android-poc/.pixiewood/android/app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-input
          path: |
            android-poc/.pixiewood/android/app/build/outputs/apk/debug/
          retention-days: 1

  emulator:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: emulator-input
          path: android-poc/.pixiewood/android/app/build/outputs/apk/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh android-poc/emulator-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screenshots
          path: android-poc/out/
      - name: Publish screenshots to the android-probe-results branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/results && cp -r android-poc/out/. /tmp/results/
          git checkout --orphan android-probe-results
          git rm -rfq . && git clean -fdxq
          cp -r /tmp/results/. .
          git add -A && git commit -qm "Probe results for ${GITHUB_SHA}"
          git push -f origin android-probe-results
